services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ticket_helper_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ticket_helper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_helper"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-helper:latest
    container_name: ticket-helper-app
    restart: unless-stopped
    ports:
      - "5173:5000"
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/ticket_helper
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-fallback-secret-min-32-characters-key}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:5173}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:5000}
      - AI_PROVIDER=${AI_PROVIDER:-google}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
